# Alembic configuration.
#
# !! THIS FILE MUST STAY PURE ASCII !!
#
# Alembic reads it via configparser with encoding="locale" (hardcoded in
# alembic/util/compat.py). On a non-UTF-8 host locale -- e.g. GBK on a
# Chinese Windows install -- any non-ASCII byte here aborts the run with
# UnicodeDecodeError. PYTHONUTF8=1 does NOT help: "locale" bypasses UTF-8 mode.
#
# Chinese explanations for this configuration live in the docstrings of
# src/testflow/storage/migrations/env.py, which is read as UTF-8 source.
#
# NOTE: there is deliberately no `sqlalchemy.url` here. The database URL comes
# from the application config (TESTFLOW_DATABASE_URL) and is injected by
# migrations/env.py at runtime -- one source of truth (08 EN3).

[alembic]
script_location = src/testflow/storage/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Run generated migrations through ruff format so they match the rest of the code.
#
# `type = exec` rather than `console_scripts`: the latter failed with
# "Could not find entrypoint console_scripts.ruff" even though ruff is installed
# in the venv -- its entry-point lookup does not see the uv-managed environment.
# exec runs the executable directly.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
